name: Deploy Adventure PWA

on:
  push:
    branches: ["main-stable"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: main-stable

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Repair known malformed legacy world package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from zipfile import ZIP_DEFLATED, ZipFile

          path = Path("adventures/Crashed_Shipwreck.zip")
          with ZipFile(path, "r") as source:
              story = source.read("story.json").decode("utf-8")
              story = story.replace("\r\n", "\n")
              if '"continue_investigating": "apex_predator"' not in story:
                  raise SystemExit("Crashed_Shipwreck.zip corruption signature was not found")
              story = story.replace(
                  '"continue_investigating": "apex_predator"',
                  '"continue_investigating": "apex_predator",',
                  1,
              )
              import re
              story = story.replace(
                  '"exits": {}\n}\n},\n"cosmic_core"',
                  '"exits": {}\n},\n"cosmic_core"',
                  1,
              )
              story = story.replace(
                  '"exits": {}\n}\n},\n"triumphant_victory"',
                  '"exits": {}\n},\n"triumphant_victory"',
                  1,
              )
              json.loads(story, strict=False)
              members = [
                  (info.filename, source.read(info.filename))
                  for info in source.infolist()
                  if not info.is_dir() and info.filename != "story.json"
              ]

          with NamedTemporaryFile(
              prefix=".Crashed_Shipwreck.",
              suffix=".zip",
              dir=path.parent,
              delete=False,
          ) as handle:
              temporary = Path(handle.name)

          try:
              with ZipFile(temporary, "w", compression=ZIP_DEFLATED) as target:
                  target.writestr("story.json", story.encode("utf-8"))
                  for name, payload in members:
                      target.writestr(name, payload)
              temporary.replace(path)
          finally:
              temporary.unlink(missing_ok=True)
          PY

      - name: Repair known malformed Forgotten Catacombs world package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from zipfile import ZIP_DEFLATED, ZipFile

          path = Path("adventures/Forgotten_Catacombs.zip")
          with ZipFile(path, "r") as source:
              story = json.loads(
                  source.read("story.json").decode("utf-8"),
                  strict=False,
              )
              try:
                  target = (
                      story["rooms"]["main_chamber"]["exits"]
                      ["Examine the Sarcophagus"]["skill_check"]
                      ["failure"]["room"]
                  )
              except KeyError as exc:
                  raise SystemExit(
                      f"Forgotten Catacombs corruption signature was not found: {exc}"
                  )
              if target != "choice_area":
                  raise SystemExit(
                      f"Forgotten Catacombs repair signature changed: {target!r}"
                  )
              story["rooms"]["main_chamber"]["exits"][
                  "Examine the Sarcophagus"
              ]["skill_check"]["failure"]["room"] = "main_chamber"
              story_text = json.dumps(
                  story,
                  indent=2,
                  ensure_ascii=False,
              ) + "\n"
              members = [
                  (info.filename, source.read(info.filename))
                  for info in source.infolist()
                  if not info.is_dir() and info.filename != "story.json"
              ]

          with NamedTemporaryFile(
              prefix=".Forgotten_Catacombs.",
              suffix=".zip",
              dir=path.parent,
              delete=False,
          ) as handle:
              temporary = Path(handle.name)

          try:
              with ZipFile(temporary, "w", compression=ZIP_DEFLATED) as target_archive:
                  target_archive.writestr("story.json", story_text.encode("utf-8"))
                  for name, payload in members:
                      target_archive.writestr(name, payload)
              temporary.replace(path)
          finally:
              temporary.unlink(missing_ok=True)
          PY

      - name: Repair incomplete legacy story worlds with authored content
        shell: bash
        run: |
          set -euo pipefail
          python tools/repair_legacy_stories.py

      - name: Build browser world catalogue
        shell: bash
        run: |
          set -euo pipefail
          rm -rf static/worlds
          mkdir -p static/worlds
          python - <<'PY'
          from __future__ import annotations

          import json
          import shutil
          from pathlib import Path

          from storage.converter import LegacyConverter

          source_root = Path("adventures")
          output_root = Path("static/worlds")
          manifest = []
          failures = []
          seen_ids = set()
          converter = LegacyConverter()

          for source in sorted(source_root.glob("*.zip")):
              if not source.is_file():
                  continue
              world_id = source.stem
              if world_id in seen_ids:
                  raise SystemExit(f"Duplicate world id in source catalogue: {world_id}")
              seen_ids.add(world_id)

              destination = output_root / f"{source.stem}.canonical.zip"
              report_path = destination.with_name(destination.name + ".report.json")

              try:
                  converter.convert_file(
                      source,
                      destination,
                      allow_lossy=False,
                      force=True,
                  )
              except Exception as exc:
                  if destination.exists():
                      destination.unlink()
                  failures.append({
                      "id": source.stem,
                      "source": source.name,
                      "format": "legacy",
                      "available": False,
                      "error": str(exc),
                  })
                  print(f"SKIPPED {source.name}: {exc}")
                  continue

              manifest.append({
                  "id": source.stem,
                  "url": "./worlds/" + destination.name,
                  "source": source.name,
                  "format": "canonical",
                  "available": True,
              })

              report_path.unlink(missing_ok=True)
              destination.with_name(destination.name + ".report.txt").unlink(missing_ok=True)

          if not manifest:
              raise SystemExit("No Adventure worlds could be converted for the browser build.")

          catalogue = manifest + failures
          ids = [item["id"] for item in catalogue]
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate world id in browser catalogue.")
          (output_root / "manifest.json").write_text(
              json.dumps(catalogue, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print(f"Built {len(manifest)} browser worlds.")
          print(f"Skipped {len(failures)} broken/unavailable worlds.")
          for item in manifest:
              print(f"  - {item['id']}")
          for item in failures:
              print(f"  - UNAVAILABLE: {item['id']} :: {item['error']}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# GitHub Pages deploys the exact main-stable tree that triggered this workflow.

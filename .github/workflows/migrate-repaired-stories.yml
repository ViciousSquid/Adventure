name: Migrate repaired story sources

on:
  push:
    branches: ["main-stable"]

permissions:
  contents: write

concurrency:
  group: migrate-repaired-stories
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main-stable
        uses: actions/checkout@v4
        with:
          ref: main-stable
          fetch-depth: 0

      - name: Repair source story packages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from zipfile import ZIP_DEFLATED, ZipFile

          def rewrite(path: Path, transform):
              with ZipFile(path, "r") as source:
                  story = json.loads(source.read("story.json").decode("utf-8"), strict=False)
                  changed = transform(story)
                  members = [
                      (info.filename, source.read(info.filename))
                      for info in source.infolist()
                      if not info.is_dir() and info.filename != "story.json"
                  ]
              if not changed:
                  return False
              text = json.dumps(story, indent=2, ensure_ascii=False) + "\n"
              with NamedTemporaryFile(prefix=f".{path.stem}.", suffix=".zip", dir=path.parent, delete=False) as handle:
                  temp = Path(handle.name)
              try:
                  with ZipFile(temp, "w", compression=ZIP_DEFLATED) as target:
                      target.writestr("story.json", text.encode("utf-8"))
                      for name, payload in members:
                          target.writestr(name, payload)
                  temp.replace(path)
              finally:
                  temp.unlink(missing_ok=True)
              return True

          def crashed(story):
              exits = story["rooms"]["apex_predator"]["exits"]
              if "continue_investigating" not in exits:
                  raise SystemExit("Crashed Shipwreck corruption signature was not found")
              if exits["continue_investigating"] != "apex_predator":
                  raise SystemExit("Crashed Shipwreck signature changed")
              exits["continue_investigating"] = "apex_predator"
              return True

          def catacombs(story):
              failure = story["rooms"]["main_chamber"]["exits"]["Examine the Sarcophagus"]["skill_check"]["failure"]
              if failure.get("room") != "choice_area":
                  raise SystemExit(f"Forgotten Catacombs signature changed: {failure.get('room')!r}")
              failure["room"] = "main_chamber"
              return True

          results = {}
          results["Crashed_Shipwreck"] = rewrite(Path("adventures/Crashed_Shipwreck.zip"), crashed)
          results["Forgotten_Catacombs"] = rewrite(Path("adventures/Forgotten_Catacombs.zip"), catacombs)
          print("KNOWN_REPAIRS", results)
          PY
          python tools/repair_legacy_stories.py

      - name: Make catalogue build source-authoritative
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/pages.yml")
          text = path.read_text(encoding="utf-8")

          step_names = [
              "      - name: Repair known malformed legacy world package\n",
              "      - name: Repair known malformed Forgotten Catacombs world package\n",
              "      - name: Repair incomplete legacy story worlds with authored content\n",
          ]
          for name in step_names:
              start = text.find(name)
              if start < 0:
                  raise SystemExit(f"Expected workflow step not found: {name.strip()}")
              end = text.find("\n      - name: ", start + len(name))
              if end < 0:
                  raise SystemExit(f"Could not find end of workflow step: {name.strip()}")
              text = text[:start] + text[end + 1:]

          needle = """          manifest = []
          failures = []
          converter = LegacyConverter()

          for source in sorted(source_root.glob("*.zip")):
"""
          replacement = """          manifest = []
          failures = []
          seen_ids = set()
          converter = LegacyConverter()

          for source in sorted(source_root.glob("*.zip")):
              world_id = source.stem
              if world_id in seen_ids:
                  raise SystemExit(f"Duplicate world id in source catalogue: {world_id}")
              seen_ids.add(world_id)
"""
          if needle not in text:
              raise SystemExit("Catalogue loop signature not found")
          text = text.replace(needle, replacement, 1)

          marker = """          if not manifest:
              raise SystemExit("No Adventure worlds could be converted for the browser build.")

          catalogue = manifest + failures
"""
          replacement_marker = """          if not manifest:
              raise SystemExit("No Adventure worlds could be converted for the browser build.")

          catalogue = manifest + failures
          ids = [item["id"] for item in catalogue]
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate world id in browser catalogue.")
"""
          if marker not in text:
              raise SystemExit("Catalogue manifest signature not found")
          text = text.replace(marker, replacement_marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit repaired source packages on migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="migration/repaired-stories-${GITHUB_SHA::12}"
          git checkout -b "$branch"

          rm -f .github/workflows/migrate-repaired-stories.yml

          git add adventures/Crashed_Shipwreck.zip \
                  adventures/Forgotten_Catacombs.zip \
                  adventures/Curse_of_the_Crimson_Cutlass.zip \
                  adventures/Enigma_of_the_Timekeeper.zip \
                  adventures/Whispers_of_the\ Forgotten_City.zip \
                  .github/workflows/pages.yml

          if git diff --cached --quiet; then
            echo "No repaired source changes to publish."
            exit 0
          fi

          git commit -m "Repair and publish legacy story sources"
          git push --set-upstream origin "$branch"
          echo "Migration branch pushed: $branch"